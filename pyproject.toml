[project]
name = "multi-agent-customer-service"
version = "0.1.0"
description = "A router-and-specialists customer service system on Anthropic + AWS."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
